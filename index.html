<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Fallback for browsers/crawlers that don't run the JS redirect below -->
<meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbxTZinst9bmeFYzoOPTkHj4bForaH1DPXW60KsNAJPBOfSOOo9IeD8tdMFM6ZwUyX0/exec">
<title>Sarkari Forms Hub</title>
<style>
  :root { --ink: #142A2C; --ink-2: #1F3D3F; --paper: #F5F3ED; --accent: #0F7D6E; --text-soft: #5C6864; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(155deg, var(--ink), var(--ink-2)); font-family: system-ui, -apple-system, sans-serif; }
  .redirect-card { text-align: center; color: #F4F1E7; padding: 40px; max-width: 380px; }
  .redirect-card svg { width: 56px; height: 56px; color: #D8B87A; margin-bottom: 18px; }
  .redirect-card h1 { font-size: 1.3rem; margin: 0 0 8px; }
  .redirect-card p { color: #C8D6D1; font-size: .92rem; margin: 0 0 22px; line-height: 1.5; }
  .redirect-card a { color: #fff; background: var(--accent); text-decoration: none; padding: 10px 20px; border-radius: 10px; font-size: .88rem; font-weight: 600; display: inline-block; }
  .spinner { width: 22px; height: 22px; border: 2.5px solid rgba(255,255,255,.25); border-top-color: #D8B87A; border-radius: 50%; margin: 0 auto 18px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner"></div>
    <h1>Sarkari Forms Hub</h1>
    <p>Taking you to the app&hellip;</p>
    <a id="manual-link" href="https://script.google.com/macros/s/AKfycbxTZinst9bmeFYzoOPTkHj4bForaH1DPXW60KsNAJPBOfSOOo9IeD8tdMFM6ZwUyX0/exec">Click here if you're not redirected automatically</a>
  </div>
  <script>
    // Replace this with your deployed Apps Script /exec URL (see SETUP.md,
    // step 6). Keep this in sync with the <meta refresh> and href above —
    // all three are set from this one constant so there's only one place
    // to edit next time the deployment URL changes.
    var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTZinst9bmeFYzoOPTkHj4bForaH1DPXW60KsNAJPBOfSOOo9IeD8tdMFM6ZwUyX0/exec";
    document.getElementById('manual-link').href = APPS_SCRIPT_URL;
    if (APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === -1) {
      window.location.replace(APPS_SCRIPT_URL);
    }
  </script>
</body>
</html>
